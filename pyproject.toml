[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "magik"
version = "0.1.0"
description = "A Pillow-inspired Python image API backed by ImageMagick/MagickWand through a Rust core"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "License :: OSI Approved :: MIT License",
]

# The extension itself has no runtime Python dependencies; ImageMagick is a
# system requirement. Test/benchmark tooling (pytest) is a plain dev install
# rather than an extra, to keep `maturin develop` output free of extra warnings.

[tool.maturin]
python-source = "python"
module-name = "magik._magik"
features = ["pyo3/extension-module"]
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:magik.*"]

[tool.ruff]
line-length = 100
target-version = "py39"