# Continuous integration for Magik.
#
# Why Windows: `crates/magik-sys/build.rs` links against the MagickWand import
# libraries under their Windows names (`CORE_RL_MagickWand_`). ImageMagick's
# Linux packages use a different naming scheme (`libMagickWand-7.Q16HDRI.so`), so
# a Linux runner cannot link this project without extra work in the build script.
# Windows is also what the project is developed and verified on.
#
# ImageMagick itself is a *system* requirement, not a Python or Cargo
# dependency: magik ships no codecs of its own and links against whatever
# MagickWand the machine provides.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the build honest and reproducible.
  RUSTFLAGS: -D warnings
  # Pinned ImageMagick, matching the version this project is developed against.
  # Headers are NOT required (magik-sys hand-declares all FFI); the link step
  # needs the MagickWand import libraries, which the Chocolatey *runtime*
  # package omits. This is the same artifact Scoop installs on a dev machine,
  # verified to contain lib\CORE_RL_MagickWand_.lib.
  IM_VERSION: '7.1.2-32'
  IM_URL: 'https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-32/ImageMagick-7.1.2-32-Q16-HDRI-x64-dll.exe'
  # Used to *extract* the ImageMagick installer, never to run it: a silent
  # install skips the component holding the import libraries. Pinned to a
  # release rather than "latest" so the runner cannot drift under us.
  INNOEXTRACT_URL: 'https://github.com/dscharrer/innoextract/releases/download/1.9/innoextract-1.9-windows.zip'

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Rust is preinstalled on GitHub's Windows runners. `rust-toolchain.toml`
      # in the repository root pins the channel and the rustfmt/clippy
      # components, so simply invoking cargo installs whatever is missing and
      # every contributor gets the same toolchain as CI.
      - name: Report the toolchain
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Locate ImageMagick link libraries
        shell: pwsh
        run: |
          # The build needs the MagickWand *import library*
          # (lib\CORE_RL_MagickWand_.lib). Headers are irrelevant: magik-sys
          # hand-declares every FFI function and includes no ImageMagick header,
          # so the cargo:include= that build.rs emits is unused.
          #
          # Specific sub-paths are checked rather than a recursive scan, which
          # took over two minutes across C:\Program Files.
          $candidates = @(
            "$env:ProgramData\chocolatey\lib\imagemagick\tools",
            "$env:ProgramData\chocolatey\lib\imagemagick",
            "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI",
            "C:\ImageMagick"
          ) + (Get-ChildItem 'C:\Program Files' -Directory -Filter 'ImageMagick*' -EA SilentlyContinue |
               ForEach-Object { $_.FullName })

          foreach ($root in $candidates | Select-Object -Unique) {
            if (-not (Test-Path $root)) { continue }
            $libs = Get-ChildItem (Join-Path $root 'lib') -Filter 'CORE_RL_*.lib' -EA SilentlyContinue
            Write-Host ("  {0}: {1}" -f $root, ($libs.Name -join ', '))
          }

          $found = $null
          foreach ($root in $candidates | Select-Object -Unique) {
            $hit = Join-Path $root 'lib\CORE_RL_MagickWand_.lib'
            if (Test-Path $hit) { $found = $root; break }
          }

          if (-not $found) {
            Write-Host "No MagickWand import library found; extracting $env:IM_VERSION"
            $installer = Join-Path $env:RUNNER_TEMP 'imagemagick.exe'
            Invoke-WebRequest -Uri $env:IM_URL -OutFile $installer -UseBasicParsing
            Write-Host ("  downloaded {0:N1} MB" -f ((Get-Item $installer).Length / 1MB))

            # Extract rather than install. The import library sits in a
            # non-default installer component, so a silent install exits 0, logs
            # "Installation process succeeded", and still leaves no .lib behind -
            # four failed CI runs came from exactly that. Extraction takes the
            # whole payload, and it is what Scoop does (innosetup: true in the
            # imagemagick manifest), which is why a Scoop install does have them.
            $tool = Join-Path $env:RUNNER_TEMP 'innoextract.exe'
            Invoke-WebRequest -Uri $env:INNOEXTRACT_URL -OutFile "$tool.zip" -UseBasicParsing
            Expand-Archive "$tool.zip" -DestinationPath "$env:RUNNER_TEMP\ie" -Force
            $dest = Join-Path $env:RUNNER_TEMP 'imagemagick'
            & $tool --extract --output-dir $dest --silent $installer
            if ($LASTEXITCODE -ne 0) { throw "innoextract failed with exit code $LASTEXITCODE" }

            $found = Join-Path $dest 'app'
            if (-not (Test-Path (Join-Path $found 'lib\CORE_RL_MagickWand_.lib'))) {
              Get-ChildItem $dest -Recurse -Filter '*.lib' | ForEach-Object { Write-Host "    $($_.FullName)" }
              throw "Extraction succeeded but lib\CORE_RL_MagickWand_.lib is absent."
            }
          }

          if (-not $found) {
            throw "No CORE_RL_MagickWand_.lib anywhere on this runner; magik-sys cannot link MagickWand."
          }
          "MAGICK_HOME=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:MAGICK_HOME = $found
          Write-Host "MAGICK_HOME=$found"
          magick -version

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ---- static checks, no build of the extension required ----
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (release)
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --workspace

      # The whole point of the crate layering: no `unsafe` may live above the
      # FFI boundary. This is the invariant Stages 01-04 were built to protect.
      - name: Verify unsafe is confined to magik-sys
        shell: pwsh
        run: |
          $leaks = rg --pcre2 '^(?!\s*//)(?!\s*//!)(?!\s*\*).*\bunsafe\b.*$' crates/magik-core src
          if ($LASTEXITCODE -eq 0 -and $leaks) {
            Write-Error "unsafe code found outside magik-sys:`n$leaks"
            exit 1
          }
          Write-Host "OK: no unsafe outside magik-sys"

  python:
    name: Python (${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml and reaches end of life
        # in Oct 2027; 3.14 is the current release and the interpreter this
        # project is developed against. Testing both ends catches a declared
        # support claim going stale, which is how 3.9 lingered here after it
        # reached EOL.
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # `rust-toolchain.toml` pins the channel and components.
      - name: Report the toolchain
        run: rustc --version && cargo --version

      - name: Locate ImageMagick link libraries
        shell: pwsh
        run: |
          # Same logic as the rust job; runner images are not shared between
          # jobs, so each one starts from the same state.
          $candidates = @(
            "$env:ProgramData\chocolatey\lib\imagemagick\tools",
            "$env:ProgramData\chocolatey\lib\imagemagick",
            "C:\Program Files\ImageMagick-7.1.2-Q16-HDRI",
            "C:\ImageMagick"
          ) + (Get-ChildItem 'C:\Program Files' -Directory -Filter 'ImageMagick*' -EA SilentlyContinue |
               ForEach-Object { $_.FullName })

          $found = $null
          foreach ($root in $candidates | Select-Object -Unique) {
            if (Test-Path (Join-Path $root 'lib\CORE_RL_MagickWand_.lib')) { $found = $root; break }
          }
          if (-not $found) {
            $installer = Join-Path $env:RUNNER_TEMP 'imagemagick.exe'
            Invoke-WebRequest -Uri $env:IM_URL -OutFile $installer -UseBasicParsing
            Write-Host ("  downloaded {0:N1} MB" -f ((Get-Item $installer).Length / 1MB))

            # Extract, not install: the import library is in a non-default
            # installer component that a silent install skips. See the rust job.
            $tool = Join-Path $env:RUNNER_TEMP 'innoextract.exe'
            Invoke-WebRequest -Uri $env:INNOEXTRACT_URL -OutFile "$tool.zip" -UseBasicParsing
            Expand-Archive "$tool.zip" -DestinationPath "$env:RUNNER_TEMP\ie" -Force
            $dest = Join-Path $env:RUNNER_TEMP 'imagemagick'
            & $tool --extract --output-dir $dest --silent $installer
            if ($LASTEXITCODE -ne 0) { throw "innoextract failed with exit code $LASTEXITCODE" }

            $found = Join-Path $dest 'app'
            if (-not (Test-Path (Join-Path $found 'lib\CORE_RL_MagickWand_.lib'))) {
              throw "Extraction succeeded but lib\CORE_RL_MagickWand_.lib is absent."
            }
          }
          if (-not $found) {
            throw "No CORE_RL_MagickWand_.lib anywhere on this runner; magik-sys cannot link MagickWand."
          }
          "MAGICK_HOME=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:MAGICK_HOME = $found
          Write-Host "MAGICK_HOME=$found"
          magick -version

      # `maturin develop` refuses to run outside an activated environment, so a
      # venv is created explicitly rather than relying on the runner's
      # preinstalled interpreter. Its path goes into GITHUB_PATH so every later
      # `python` is the venv one.
      - name: Create the virtual environment
        run: |
          python -m venv .venv
          ".venv\Scripts\python.exe" -m pip install --upgrade pip

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      # maturin and pytest are dev tooling only; the extension itself has no
      # runtime Python dependencies.
      - name: Install test dependencies
        run: python -m pip install maturin pytest

      # `maturin develop` builds the extension into the active interpreter, which
      # is how the project is tested locally.
      - name: Build and install the extension
        run: python -m maturin develop --release

      - name: Report the ImageMagick that was linked against
        run: python -c "import magik; print(magik.version())"

      - name: Run the Python test suite
        run: python -m pytest -q

      # Packaging is a separate concern from the in-place build: it catches
      # missing files in the wheel that `develop` would paper over.
      - name: Build a wheel
        run: python -m maturin build --release

      - name: Install the wheel into a clean environment and retest
        shell: pwsh
        run: |
          # A separate interpreter, so the wheel is proven installable rather
          # than merely shadowed by the editable build above.
          python -m venv .wheeltest
          $python = ".\.wheeltest\Scripts\python.exe"
          $wheel = (Get-ChildItem target\wheels\*.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "no wheel was produced" }
          & $python -m pip install --upgrade pip
          & $python -m pip install $wheel
          & $python -m pip install pytest
          # Prove the import came from site-packages and not the checkout, which
          # sits one directory up and would otherwise be found first.
          & $python -c "import magik, sys; assert 'wheeltest' in magik.__file__, magik.__file__; print(magik.__file__)"
          & $python -m pytest tests -q